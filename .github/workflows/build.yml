name: Build WubiUEFI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'WubiUEFI version tag/branch to build'
        required: false
        default: 'master'

jobs:
  build:
    name: Build wubi.exe
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout WubiUEFI repository
        uses: actions/checkout@v4
        with:
          repository: hakuna-m/wubiuefi
          ref: ${{ github.event.inputs.version }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wine64 wine32 \
            winetricks \
            python3 python3-pip \
            make \
            grub2-common grub-pc-bin \
            p7zip-full \
            curl \
            gnupg2 \
            software-properties-common \
            xvfb

      - name: Configure Wine
        run: |
          export WINEPREFIX=/home/runner/.wine
          export WINEARCH=win32
          export WINEDLLOVERRIDES="mscoree,mshtml="
          wineboot --init
          # Wait for wine to initialize
          sleep 10

      - name: Install Windows Python 2.7 in Wine
        run: |
          export WINEPREFIX=/home/runner/.wine
          export WINEARCH=win32

          # Download Python 2.7.18 (last 2.7 release)
          cd /tmp
          curl -L -o python-2.7.18.msi "https://www.python.org/ftp/python/2.7.18/python-2.7.18.msi"

          # Install Python silently
          wine msiexec /i python-2.7.18.msi /qn TARGETDIR=C:\\Python27 ALLUSERS=1

          # Wait for installation
          sleep 30

          # Verify Python installation
          wine "C:\\Python27\\python.exe" --version

      - name: Install pywin32 in Wine Python
        run: |
          export WINEPREFIX=/home/runner/.wine
          export WINEARCH=win32

          # Install pywin32 for Python 2.7
          wine "C:\\Python27\\python.exe" -m pip install pywin32==224

          # Install required packages
          wine "C:\\Python27\\python.exe" -m pip install pefile

      - name: Setup build environment
        run: |
          # Create symlinks for the build system
          mkdir -p build
          mkdir -p wine/drive_c/Python27

          # Copy Wine Python to where build expects it
          cp -r /home/runner/.wine/drive_c/Python27/* wine/drive_c/Python27/

          # Create pywine wrapper script
          cat > tools/pywine << 'EOF'
#!/bin/bash
export WINEPREFIX=/home/runner/.wine
export WINEARCH=win32
export WINEDLLOVERRIDES="mscoree,mshtml="
exec wine "$@"
EOF
          chmod +x tools/pywine

          # Create check_wine script
          cat > tools/check_wine << 'EOF'
#!/bin/bash
export WINEPREFIX=/home/runner/.wine
export WINEARCH=win32
wine --version
EOF
          chmod +x tools/check_wine

          # Create check_winboot script
          cat > tools/check_winboot << 'EOF'
#!/bin/bash
which grub-mkimage || exit 1
which grub-ntldr-img || exit 1
EOF
          chmod +x tools/check_winboot

      - name: Apply fixed isolist.ini
        run: |
          # Download the fixed isolist.ini from the user's provided content
          cat > data/isolist.ini << 'ISOLIST_EOF'
