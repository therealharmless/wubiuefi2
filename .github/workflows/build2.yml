name: Build WubiUEFI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Branch/tag to build (use your fork with fixed isolist.ini)'
        required: false
        default: 'master'

jobs:
  build:
    name: Build wubi.exe
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wine64 \
            libwine \
            wine \
            winetricks \
            python3 python3-pip \
            make \
            grub2-common grub-pc-bin \
            p7zip-full \
            curl \
            xvfb

      - name: Configure Wine
        run: |
          export WINEPREFIX=/home/runner/.wine
          export WINEARCH=win32
          export WINEDLLOVERRIDES="mscoree,mshtml="
          wineboot --init
          sleep 10

      - name: Install Windows Python 2.7 in Wine
        run: |
          export WINEPREFIX=/home/runner/.wine
          export WINEARCH=win32
          cd /tmp
          curl -L -o python-2.7.18.msi "https://www.python.org/ftp/python/2.7.18/python-2.7.18.msi"
          wine msiexec /i python-2.7.18.msi /qn TARGETDIR=C:\\Python27 ALLUSERS=1
          sleep 30
          wine "C:\\Python27\\python.exe" --version

      - name: Install Python packages in Wine
        run: |
          export WINEPREFIX=/home/runner/.wine
          export WINEARCH=win32
          wine "C:\\Python27\\python.exe" -m pip install pywin32==224 pefile

      - name: Setup build environment
        run: |
          mkdir -p build wine/drive_c/Python27
          cp -r /home/runner/.wine/drive_c/Python27/* wine/drive_c/Python27/

          printf '#!/bin/bash\nexport WINEPREFIX=/home/runner/.wine\nexport WINEARCH=win32\nexport WINEDLLOVERRIDES="mscoree,mshtml="\nexec wine "$@"\n' > tools/pywine
          chmod +x tools/pywine

          printf '#!/bin/bash\nexport WINEPREFIX=/home/runner/.wine\nexport WINEARCH=win32\nwine --version\n' > tools/check_wine
          chmod +x tools/check_wine

          printf '#!/bin/bash\nwhich grub-mkimage || exit 1\nwhich grub-ntldr-img || exit 1\n' > tools/check_winboot
          chmod +x tools/check_winboot

      - name: Build wubi.exe
        run: |
          export WINEPREFIX=/home/runner/.wine
          export WINEARCH=win32
          export WINEDLLOVERRIDES="mscoree,mshtml="
          make wubi 2>&1 | tee build.log
          if [ -f build/wubi.exe ]; then
            echo "Build successful!"
            ls -la build/wubi.exe
          else
            echo "Build failed. Checking build log..."
            tail -50 build.log
            exit 1
          fi

      - name: Verify executable
        run: |
          if [ -f build/wubi.exe ]; then
            file build/wubi.exe
            export WINEPREFIX=/home/runner/.wine
            export WINEARCH=win32
            timeout 10 wine build/wubi.exe --help 2>&1 || true
          fi

      - name: Upload wubi.exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wubi-exe
          path: build/wubi.exe
          retention-days: 7
